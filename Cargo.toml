[package]
name = "lunar-api"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
strip = false

[dependencies]
url = "2.5.8"
sha2 = "0.11.0"
mimalloc = "0.1"
base64 = "0.23.1"
regex  = "1.13.1"
rand   = "0.10.2"
dotenvy = "0.15.7"
rustc-hash = "2.1.3"
memchr = "2"
rayon = "1"
libm = "0.2.16"
ryu = "1.0.23"
oxc_ast = "0.151.0"
actix-web = "4.14.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
oxc_span = "0.151.0"
thiserror = "2.0.20"
oxc_syntax = "0.151.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
oxc_parser = "0.151.0"
wreq-util = "3.0.0-rc.13"
oxc_ast_visit = "0.151.0"
oxc_allocator = "0.151.0"
serde = { version = "1.0.229", features = ["derive"] }
wreq = { version = "6.0.0-rc.29", features = ["cookies", "gzip", "brotli", "deflate", "zstd"] }
[patch.crates-io]
btls-sys = { path = "src/utils/vendor/btls-sys" }
